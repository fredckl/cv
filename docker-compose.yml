version: '3.8'

services:
  # Service de développement
  dev:
    image: node:18-alpine
    container_name: frederic-portfolio-dev
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --no-open"
    environment:
      - NODE_ENV=development

  # Service de production
  prod:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: frederic-portfolio-prod
    ports:
      - "80:80"
    restart: unless-stopped
